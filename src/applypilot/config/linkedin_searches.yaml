# Candidate-operated LinkedIn Content Search presets.  These are URL-building
# inputs only; ApplyPilot must not use them for unattended LinkedIn scraping.
defaults:
  window: past-24h
  sort: latest
  # Live comparison on 2026-08-24 found plain terms dominated by global spam;
  # Singapore hiring hashtags plus one exact role phrase yielded local job posts.
  query_style: hashtag_exact
  hiring_terms:
    - "#hiring"
  location_terms:
    - "#singaporejobs"
  max_role_terms_per_query: 1

