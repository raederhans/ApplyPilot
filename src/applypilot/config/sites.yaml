# Direct career site registry for ApplyPilot
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).

# ── Singapore portal policies ─────────────────────────────────────────────
#
# These are application controls, not discovery targets. They deliberately do
# not appear in `sites:` below: a portal policy must never turn a protected
# job board into a scripted crawler.
#
# `manual_only` blocks ApplyPilot browser actions, including a fill-only
# preview. `review_only` permits one visible fill-only preview but never lets
# ApplyPilot submit. Assessment, verification, and CAPTCHA remain applicant
# boundaries even when a portal permits standing-authorized submission.
portal_policies:
  - name: "JobStreet Singapore"
    domains:
      - "jobstreet.com"
    site_names:
      - "JobStreet"
      - "JobStreet Singapore"
    # Listings may enter the local job list only through an authorised export,
    # feed, or candidate-provided CSV. ApplyPilot never queries JobStreet.
    discovery_mode: "authorized_import_only"
    application_mode: "manual_only"
    assessment_mode: "employer_invited_manual_only"
    external_application_mode: "manual_reconfirm"
    submitted_evidence: "candidate-visible confirmation page or receipt"

  - name: "InternSG"
    domains:
      - "internsg.com"
    site_names:
      - "InternSG"
    discovery_mode: "manual_only"
    # Candidate-supplied exact listings may use the standing submission policy;
    # discovery remains manual and visible CAPTCHA still requires the relay.
    application_mode: "standing_authorized"
    assessment_mode: "employer_invited_manual_only"
    external_application_mode: "continue_when_authorized"
    submitted_evidence: "candidate-visible confirmation page or receipt"

  - name: "NTU Career Axis"
    domains:
      - "careeraxis.ntu.edu.sg"
    site_names:
      - "CareerAxis"
      - "Career Axis"
      - "NTU Career Axis"
    # Career Axis is an NTU-authenticated source. An agent may search it in a
    # visible, user-authenticated browser with candidate-selected keywords and
    # import each exact opportunity; do not turn it into a generic crawler. The user's
    # standing ApplyPilot authorization covers ordinary forms and its external
    # employer-ATS hand-offs after the usual live safety checks pass.
    discovery_mode: "visible_agent_browse"
    application_mode: "standing_authorized"
    external_application_mode: "continue_when_authorized"
    submitted_evidence: "exact job/company confirmation page or receipt"

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "accenture"
    - "AccentureCareers"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%accenture%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"
  - "sso.cisco.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Job Bank Canada": "https://www.jobbank.gc.ca"
  "CareerJet Canada": "https://www.careerjet.ca"
  "BuiltIn Remote": "https://builtin.com"
  "Hacker News Jobs": "https://news.ycombinator.com/"
  "RemoteOK": null
  "WelcomeToTheJungle": null
  "Workopolis": "https://www.workopolis.com"
  "WeWorkRemotely": "https://weworkremotely.com"
  "Startup.jobs": "https://startup.jobs"
  "Nodesk": "https://nodesk.co"
  "Talent.com": "https://www.talent.com"
  "JustRemote": "https://justremote.co"
  "Arc.dev": "https://arc.dev"
  "Himalayas": "https://himalayas.app"
  "Techstars Jobs": "https://www.techstars.com"
  "Randstad Canada": "https://www.randstad.ca/jobs/search/"

sites:
  # ── Searchable sites (URL includes query + location params) ──────────
  # Canada-specific
  - name: "Eluta"
    url: "https://www.eluta.ca/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "Talent.com"
    url: "https://www.talent.com/jobs?k={query_encoded}&l={location_encoded}"
    type: search

  - name: "Randstad Canada"
    url: "https://www.randstad.ca/jobs/?keywords={query_encoded}&location={location_encoded}"
    type: search

  - name: "CareerJet Canada"
    url: "https://www.careerjet.ca/search/jobs?s={query_encoded}&l={location_encoded}"
    type: search

  - name: "Job Bank Canada"
    url: "https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring={query_encoded}&locationstring={location_encoded}&fage=2&sort=D"
    type: search

  # General tech (with search)
  - name: "Dice"
    url: "https://www.dice.com/jobs?q={query_encoded}&location=Remote&pageSize=100"
    type: search

  - name: "SimplyHired"
    url: "https://www.simplyhired.com/search?q={query_encoded}&l={location_encoded}"
