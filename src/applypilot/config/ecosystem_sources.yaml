sources:
  - id: linkedin-content-manual
    name: LinkedIn Content Search
    enabled: true
    record_kinds: [job_lead]
    publisher_type: social_content
    access_mode: candidate_visible_login
    collection_modes: {job_lead: manual_url_import}
    coverage_mode: non_exhaustive
    allowed_hosts: [linkedin.com]
    discovery_url: https://www.linkedin.com/search/results/content/
    login_requirement: required
    employer_official_url_policy: reject_ecosystem_hosts
    disable_reason: null

  - id: careeraxis
    name: NTU CareerAxis
    enabled: true
    record_kinds: [job_lead]
    publisher_type: authenticated_campus_portal
    access_mode: candidate_visible_login
    collection_modes: {job_lead: manual_url_import}
    coverage_mode: non_exhaustive
    allowed_hosts: [careeraxis.ntu.edu.sg]
    discovery_url: https://careeraxis.ntu.edu.sg/
    login_requirement: required
    employer_official_url_policy: reject_ecosystem_hosts
    disable_reason: null

  - id: mycareersfuture
    name: MyCareersFuture
    enabled: true
    record_kinds: [job_lead]
