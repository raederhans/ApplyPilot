name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify optional job-board dependency chain
        run: |
          python -m pip install -e ".[jobboards]"
          python -c "from jobspy import scrape_jobs; assert callable(scrape_jobs)"

      - name: Lint
        run: ruff check src

      - name: Test core tier
        run: python -m pytest -q -m "not browser and not windows"

      - name: Build distribution
        run: python scripts/build_release.py

      - name: Verify wheel metadata and CLI
        run: |
          python -m pip install --force-reinstall --no-deps dist/python/*.whl
          python -m pip check
          applypilot --version

  compatibility:
    name: Compatibility Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test compatibility subset
        run: python -m pytest -q -m "compatibility and not browser and not windows"

  browser-chromium:
    name: Browser Chromium 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Test browser tier
        run: python -m pytest -q -m browser

  windows-install-smoke:
    name: Windows 3.12 tests and clean install smoke
    runs-on: windows-latest
    needs: [core, compatibility, browser-chromium]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bind isolated ApplyPilot workspace
        shell: pwsh
        run: '"APPLYPILOT_DIR=$env:RUNNER_TEMP\applypilot-ci" >> $env:GITHUB_ENV'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test Windows tier
        run: python -m pytest -q -m windows

      - name: Build release artifacts
        run: python scripts/build_release.py

      - name: Exercise clean installed workspace
        run: python scripts/smoke_release.py
