name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify optional job-board dependency chain
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install -e ".[jobboards]"
          python -c "from jobspy import scrape_jobs; assert callable(scrape_jobs)"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: ruff check src

      - name: Test
        run: pytest -q

      - name: Build distribution
        if: matrix.python-version == '3.12'
        run: python scripts/build_release.py

      - name: Verify wheel metadata and CLI
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --force-reinstall --no-deps dist/python/*.whl
          python -m pip check
          applypilot --version
