name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install verification dependencies
        run: python -m pip install -e ".[dev,jobboards]"

      - name: Verify tag matches package version
        run: |
          python -c "import os, pathlib, tomllib; version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; actual = os.environ['GITHUB_REF_NAME']; assert actual == f'v{version}', f'tag {actual} does not match v{version}'"

      - name: Verify release candidate
        run: |
          ruff check src
          python -m pytest -q
          python scripts/build_release.py

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify-and-build
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

  github-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/python/*.whl \
            dist/python/*.tar.gz \
            dist/*-bundle.zip \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
